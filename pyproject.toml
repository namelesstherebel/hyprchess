[project]
name = "hyprchess"
version = "0.1.0"
description = "Terminal chess for Omarchy: Stockfish, online play, clocks and custom skins"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["textual>=8,<9", "chess>=1.11,<2"]

[project.scripts]
hyprchess = "hyprchess.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyprchess"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 120
